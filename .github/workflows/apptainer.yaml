on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: Test (Apptainer)

jobs:
  test:
    name: Test (Apptainer)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Build Repository Container
        run: |
          echo "Building container with current repository"
          make build-apptainer

      - name: Run Container Tests
        run: |
          cd vm/apptainer
          apptainer test /tmp/assassyn.sif

      - name: Run pytest tests
        run: |
          apptainer exec /tmp/assassyn.sif pytest -n 8 python/ci-tests python/unit-tests

      - name: Cleanup Temporary Build Files
        if: always()
        run: |
          echo "Cleaning up temporary build files (preserving container for dependent workflows)"
          rm -f /tmp/repo.sif
          rm -f /tmp/repo.tar.gz
          echo "Temporary files cleaned (container at /tmp/assassyn.sif preserved)"
